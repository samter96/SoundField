<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SoundField — Sound Effect Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="slate" data-density="regular" data-radius="2">
<div id="root"></div>

<!-- 글로벌 에러 캡쳐 (stack 포함) -->
<script>
  window.addEventListener("error", (e) => {
    console.error("[GLOBAL]", e.message, "@", e.filename + ":" + e.lineno + ":" + e.colno,
                  "\nstack:", (e.error && e.error.stack) ? e.error.stack : "(no stack)");
  });
  window.addEventListener("unhandledrejection", (e) => {
    console.error("[UNHANDLED REJECTION]", e.reason, (e.reason && e.reason.stack) || "");
  });
</script>

<!-- Qt WebChannel (Python bridge) -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  // bridge 가 준비되기 전에도 호출 큐잉 가능하게
  window.__bridgeReady = new Promise((resolve) => {
    document.addEventListener("DOMContentLoaded", () => {
      try {
        new QWebChannel(qt.webChannelTransport, function(channel) {
          window.bridge = channel.objects.bridge;
          resolve(window.bridge);
        });
      } catch (e) {
        console.warn("QWebChannel init failed:", e);
        resolve(null);
      }
    });
  });
</script>

<!-- React + Babel (CDN; 차단 환경이면 로컬 번들로 교체)
     production.min.js 사용 — dev 빌드 대비 5~10배 빠름 (warning/PropTypes 검증 제거) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="player.jsx"></script>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
